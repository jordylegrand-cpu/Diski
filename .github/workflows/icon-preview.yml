name: Icon preview cleanup

# One-off: removes the ref the temporary icon-preview workflow published its
# renders to. This file is deleted in the next commit.
on:
  push:
    paths:
      - '.github/workflows/icon-preview.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove the temporary renders ref
        run: |
          git init -q .
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" :refs/diski-ci/icons || true
