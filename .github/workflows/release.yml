name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v0.1.0-alpha"
        required: true
        default: "v0.1.0-alpha"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ inputs.version }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild -project Diski.xcodeproj -scheme Diski -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/Diski.app "Diski-${{ inputs.version }}.zip"
          shasum -a 256 "Diski-${{ inputs.version }}.zip" | tee checksum.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          SUM=$(cut -d' ' -f1 checksum.txt)
          cat > notes.md <<NOTES
          <p align="center"><img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docs/icon.png" width="128" alt="Diski"></p>

          **Diski ${VERSION}** — the first public alpha of the fast, native Finder alternative for macOS 26 and later.

          - Four views (icons, list, columns, gallery), Finder's sidebar and native preview pane
          - Instant APFS clones, parallel copies, Finder's Copy window with pause and stop
          - Native Get Info, View Options, conflict alerts, Go to Folder and Connect to Server
          - Dual pane, instant filter, cut & paste, folder sizes, Recents and more — see the README

          ### Install
          1. Download **Diski-${VERSION}.zip** below, unzip it and move **Diski.app** to Applications.
          2. This alpha is not notarized yet. Before the first launch, run:
             \`xattr -dr com.apple.quarantine /Applications/Diski.app\`
          3. Open Diski. For the Trash and other protected folders, give it Full Disk Access in System Settings › Privacy & Security.

          SHA-256: \`${SUM}\`

          This is an alpha: expect rough edges and please report issues.
          NOTES
          gh release create "$VERSION" "Diski-${VERSION}.zip" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Diski ${VERSION}" --notes-file notes.md --latest
